name: macOS Release

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'stage/**']
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # checks.yml reads this exact line so both workflows use the same SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare Flutter and CocoaPods configuration
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release --config-only --no-pub
          git diff --exit-code -- pubspec.lock macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Resolve the committed remote Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.ci-source-packages" \
            -packageCachePath "$GITHUB_WORKSPACE/.ci-cache/swiftpm" \
            -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Build an unsigned Release app for Apple Silicon
        run: |
          xcodebuild build \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/macos" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.ci-source-packages" \
            -packageCachePath "$GITHUB_WORKSPACE/.ci-cache/swiftpm" \
            -disableAutomaticPackageResolution \
            -jobs 2 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO
          git diff --exit-code -- pubspec.lock macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Package the app for local acceptance
        run: |
          app=build/macos/Build/Products/Release/EmbyView.app
          test -d "$app"
          test -x "$app/Contents/MacOS/EmbyView"
          lipo "$app/Contents/MacOS/EmbyView" -verify_arch arm64
          mkdir -p outputs
          ditto -c -k --sequesterRsrc --keepParent "$app" outputs/EmbyView-macos-arm64-unsigned.zip
          shasum -a 256 outputs/EmbyView-macos-arm64-unsigned.zip > outputs/SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release-arm64-unsigned
          path: |
            outputs/EmbyView-macos-arm64-unsigned.zip
            outputs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
