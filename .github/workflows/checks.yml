name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'stage/**']
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [analyze, app-0, app-1, app-2, packages]
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the shared Flutter version
        run: |
          version=$(sed -n "s/^  FLUTTER_VERSION: '\(.*\)'$/\1/p" .github/workflows/build.yml)
          test -n "$version"
          echo "FLUTTER_VERSION=$version" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the committed Dart dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze the app and packages
        if: matrix.suite == 'analyze'
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
          for package in packages/*; do
            if [ -f "$package/pubspec.yaml" ] && [ -d "$package/test" ]; then
              (cd "$package" && flutter pub get && flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings)
            fi
          done
      - name: Run app unit tests
        if: startsWith(matrix.suite, 'app-')
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mapfile -t files < <(find test -name '*_test.dart' | LC_ALL=C sort | awk -v shard="${SUITE#app-}" '(NR - 1) % 3 == shard')
          test "${#files[@]}" -gt 0
          flutter test --no-pub "${files[@]}"
      - name: Run package unit tests
        if: matrix.suite == 'packages'
        run: |
          for package in packages/*; do
            if [ -f "$package/pubspec.yaml" ] && [ -d "$package/test" ]; then
              (cd "$package" && flutter pub get && flutter test --no-pub)
            fi
          done
      - name: Check the committed Dart lock did not change
        run: git diff --exit-code -- pubspec.lock
